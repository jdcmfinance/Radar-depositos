name: RadarDepositos - monitor de fuentes y publicacion

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # Cada hora, minuto 17 (UTC). GitHub puede retrasarlo.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  consultar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Consultar fuentes de los depositos
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path

          class TextoVisible(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ocultar = 0
                  self.partes = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'script', 'style', 'noscript', 'svg'}:
                      self.ocultar += 1
              def handle_endtag(self, tag):
                  if tag in {'script', 'style', 'noscript', 'svg'}:
                      self.ocultar = max(0, self.ocultar - 1)
              def handle_data(self, data):
                  if not self.ocultar:
                      self.partes.append(data)

          def cargar_json(ruta):
              return json.loads(ruta.read_text(encoding='utf-8'))

          def cargar_ofertas():
              ruta = Path('data/offers.json')
              if ruta.exists():
                  return cargar_json(ruta)
              html = Path('index.html').read_text(encoding='utf-8')
              hallado = re.search(
                  r'<script\s+id=["\']snapshot-data["\'][^>]*>(.*?)</script>',
                  html, flags=re.S | re.I,
              )
              if not hallado:
                  raise RuntimeError('No se encuentra el JSON inicial en index.html')
              return json.loads(hallado.group(1))

          def consultar(url):
              solicitud = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; RadarDepositos/1.0; monitor informativo)',
                  'Accept': 'text/html,application/xhtml+xml',
                  'Accept-Language': 'es-ES,es;q=0.9',
              })
              with urllib.request.urlopen(solicitud, timeout=20) as respuesta:
                  tipo = respuesta.headers.get('Content-Type', '')
                  if 'html' not in tipo.lower():
                      raise ValueError('La fuente no devuelve HTML')
                  bruto = respuesta.read(2_000_001)
              if len(bruto) > 2_000_000:
                  raise ValueError('Página demasiado grande para el monitor')
              parser = TextoVisible()
              parser.feed(bruto.decode('utf-8', errors='replace'))
              texto = re.sub(r'\s+', ' ', ' '.join(parser.partes)).strip()
              if len(texto) < 150:
                  raise ValueError('Página vacía o posiblemente bloqueada')
              # Detectar cambios en fragmentos financieros, no solo cambios decorativos.
              fragmentos = re.findall(
                  r'.{0,100}(?:dep[oó]sit|\bTAE\b|rentabilidad|inter[eé]s|\bTIN\b|plazo).{0,180}',
                  texto, flags=re.I,
              )
              if not fragmentos:
                  raise ValueError('No se encuentra contenido financiero legible')
              extracto = ' '.join(fragmentos[:150]).lower()
              return hashlib.sha256(extracto.encode('utf-8')).hexdigest()

          datos = cargar_ofertas()
          estado_ruta = Path('data/monitor_state.json')
          estado = cargar_json(estado_ruta) if estado_ruta.exists() else {}
          fecha = datetime.now(timezone.utc).isoformat(timespec='seconds')
          fuentes = {}
          for oferta in datos['offers']:
              url = oferta.get('source_url')
              if url and url.startswith('https://'):
                  fuentes.setdefault(url, set()).add(oferta['bank'])

          accesibles = 0
          nuevos_eventos = []
          for url, bancos in sorted(fuentes.items()):
              anterior = estado.get(url, {})
              actual = dict(anterior)
              actual['last_checked'] = fecha
              nombre = ' / '.join(sorted(bancos))
              try:
                  huella = consultar(url)
                  accesibles += 1
                  if anterior.get('fingerprint') and anterior['fingerprint'] != huella:
                      nuevos_eventos.append({
                          'bank': nombre, 'months': 'varios', 'at': fecha,
                          'message': 'La página fuente ha cambiado: revisar TAE y condiciones manualmente',
                      })
                  actual.update(fingerprint=huella, status='ok', last_success=fecha)
                  actual.pop('error', None)
                  print('OK', nombre, url)
              except Exception as ex:
                  actual['status'] = 'error'
                  actual['error'] = str(ex)[:180]
                  print('ERROR', nombre, url, str(ex)[:180])
                  if anterior.get('status') != 'error':
                      nuevos_eventos.append({
                          'bank': nombre, 'months': 'varios', 'at': fecha,
                          'message': 'Fuente no accesible; datos pendientes de verificación',
                      })
              estado[url] = actual

          meta = datos.setdefault('meta', {})
          meta['last_checked'] = fecha
          meta['monitor_enabled'] = accesibles > 0
          if accesibles:
              meta['last_success'] = fecha
          meta['monitor_details'] = (
              f'Fuentes accesibles: {accesibles}/{len(fuentes)}. '
              'Las TAE NO se modifican sin confirmación.'
          )
          datos['events'] = (datos.get('events', []) + nuevos_eventos)[-40:]
          Path('data').mkdir(parents=True, exist_ok=True)
          Path('data/offers.json').write_text(
              json.dumps(datos, ensure_ascii=False, indent=2) + '\n', encoding='utf-8',
          )
          estado_ruta.write_text(
              json.dumps(estado, ensure_ascii=False, indent=2) + '\n', encoding='utf-8',
          )
          print(f'FINAL: {accesibles}/{len(fuentes)} fuentes accesibles; {len(nuevos_eventos)} avisos')
          PY

      - name: Guardar resultados en GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Radar: comprobacion horaria de fuentes"
            git push origin HEAD:main
          fi

      - name: Preparar archivos para la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
