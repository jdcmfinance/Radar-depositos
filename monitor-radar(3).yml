name: RadarDepositos - actualizar TAE y publicar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'requirements.txt'
      - 'data/offers.json'
      - '.github/workflows/monitor-radar.yml'
  schedule:
    - cron: '17 * * * *' # Cada hora, minuto 17 UTC (puede retrasarse)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Compatibilizar el estado del monitor anterior
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ruta = Path('data/monitor_state.json')
          estado = json.loads(ruta.read_text(encoding='utf-8')) if ruta.exists() else {}
          if not isinstance(estado, dict):
              estado = {}
          if not isinstance(estado.get('sources'), dict):
              estado['sources'] = {}
          ruta.parent.mkdir(parents=True, exist_ok=True)
          ruta.write_text(json.dumps(estado, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Consultar ofertas y actualizar TAE verificadas
        run: python monitor.py

      - name: Guardar TAE, historial y ofertas pendientes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/monitor_state.json data/pending.json
          if ! git diff --cached --quiet; then
            git commit -m "Radar: actualizar TAE verificadas y estado"
            git push origin HEAD:main
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
